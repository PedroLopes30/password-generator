<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h2>Gerador de Senhas</h2>
        
        <div class="container-result">
            <span id="password-result">SuaSenhaAqui</span>
            <button id="copy-btn">Copiar</button>
        </div>

        <div>
            <div class="background-strength-bar">
                <div id="strength-bar"></div>
            </div>
            <div id="strength-text">Força</div>
        </div>

        <div class="container-options">
            <label>
                Tamanho da Senha: <span id="value-length"></span>
                <input type="number" id="password-length" min="6" max="32" value="12">
            </label>
            <label>
                <input type="checkbox" id="uppercase" checked> Incluir Letras Maiúsculas
            </label>
            <label>
                <input type="checkbox" id="lowercase" checked> Incluir Letras Minúsculas
            </label>
            <label>
                <input type="checkbox" id="numbers" checked> Incluir Números
            </label>
            <label>
                <input type="checkbox" id="symbols"> Incluir Caracteres Especiais
            </label>
        </div>

        <button id="generate-btn">Gerar Senha</button>
    </div>

    <script src="./src/script.js"></script>
</body>
</html>
