<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body>
    <main>
        <h2>Gerador de Senhas</h2>

        <header>
            <div id="strength-text">Escolha a Força</div>
            <input type="range" id="strength-bar" min="1" max="3" value="2" step="1">
        </header>

        <section>
            <div>
                <label>Tamanho da Senha: <span id="value-length"></span></label>
                <input type="number" id="password-length" min="6" max="32" value="12">
            </div>
            
            <div>
                <input type="checkbox" id="uppercase" checked>
                <label>Incluir Letras Maiúsculas</label>
            </div>

            <div>
                <input type="checkbox" id="lowercase" checked>
                <label>Incluir Letras Minúsculas</label>
            </div>

            <div>
                <input type="checkbox" id="numbers" checked>
                <label>Incluir Números</label>
            </div>

            <div>
                <input type="checkbox" id="symbols" checked>
                <label>Incluir Caracteres Especiais</label>
            </div>
        </section>
        

        <button id="generate-btn">Gerar Senha</button>

        <div>
            <span id="password-result">Sua Senha Aqui</span>
            <button id="copy-btn">Copiar</button>
        </div>
    </main>

    <script src="./src/script.js"></script>
</body>
</html>
